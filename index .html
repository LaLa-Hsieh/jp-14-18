<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>第14〜18課 日語有聲自主學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE4;--card:#FFFCF5;--soft:#EAE2D2;--soft2:#F7F1E5;--line:#E3DACA;--ink:#1E1C19;--ink2:#4A453D;--muted:#6A6358;--faint:#8A8276;
  --red:#B8432F;--red-d:#8E3222;--red-t:#F8E4DF;--navy:#27466B;--navy-t:#E2E8F0;--green:#2F7A55;--green-t:#E6F2EA;--gold:#C89A2E;
  --zh:'Noto Sans TC',system-ui,'PingFang TC','Microsoft JhengHei',sans-serif;
  --jp:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --jpd:'Klee One','Noto Sans JP','Hiragino Mincho ProN',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150F;--card:#221F18;--soft:#2E2A21;--soft2:#2A261E;--line:#3A352B;--ink:#EDE7DA;--ink2:#D2CABA;--muted:#A99F8E;--faint:#8D8474;
  --red:#E07A63;--red-d:#B8432F;--red-t:#3B241E;--navy:#8EB0D8;--navy-t:#22303F;--green:#6CC59A;--green-t:#1D3328;--gold:#E2B95A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17150F;--card:#221F18;--soft:#2E2A21;--soft2:#2A261E;--line:#3A352B;--ink:#EDE7DA;--ink2:#D2CABA;--muted:#A99F8E;--faint:#8D8474;
  --red:#E07A63;--red-d:#B8432F;--red-t:#3B241E;--navy:#8EB0D8;--navy-t:#22303F;--green:#6CC59A;--green-t:#1D3328;--gold:#E2B95A;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.65}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:8px}
.jp{font-family:var(--jp)}
.jpd{font-family:var(--jpd);font-weight:600}
ruby{ruby-position:over}
rt{font-family:var(--jp);font-size:.5em;color:var(--red);font-weight:500;letter-spacing:0;line-height:1}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
svg.i{width:20px;height:20px;flex:none}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.hdr-in{display:flex;align-items:center;gap:8px;min-height:58px;padding-top:6px;padding-bottom:6px}
.icon-btn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--soft)}
.hdr-t{flex:1;min-width:0;padding-left:4px}
.hdr-t small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;line-height:1.3}
.hdr-t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.pill-btn{height:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:flex;align-items:center;gap:6px;font-size:14px;flex:none}
.pill-btn:hover{border-color:var(--red)}
.pill-btn svg{width:18px;height:18px}

main{padding-top:16px;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.sec{margin-top:18px}
.sec-t{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink2)}
.sec-t .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sec-t .sub{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:16px;text-align:center}
.btn:hover{border-color:var(--ink2)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.btn-red:hover{border-color:var(--red);filter:brightness(1.05)}
.btn-red:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-navy{color:#14202E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-navy{color:#14202E}}
.btn-block{width:100%}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:72px;width:100%}
.tile:hover{border-color:var(--red)}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted);line-height:1.45}
.tile .top{color:var(--ink);display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:8px}
.tile .best{font-size:12px;font-weight:700;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--red)}
.chip .c{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.muted{color:var(--muted)}
.small{font-size:13px}

/* home */
.hero{padding:22px 22px 20px;border-radius:22px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--red);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(24px,6vw,32px);line-height:1.3;font-weight:900;max-width:calc(100% - 90px)}
.hero p{margin:8px 0 0;color:var(--ink2);max-width:34em}
.hero .kana{position:absolute;right:18px;top:12px;z-index:2;font-family:var(--jpd);font-size:56px;color:#fff;line-height:1}
.steps3{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:14px;color:var(--ink2)}
.steps3 span{display:inline-flex;align-items:center;gap:6px}
.steps3 i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.resume{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:2px solid var(--red);background:var(--card);width:100%;text-align:left;margin-top:14px}
.resume .ic{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.resume small{display:block;font-size:12px;color:var(--red);font-weight:700;letter-spacing:.06em}
.resume b{display:block;font-size:16px}
.resume em{font-style:normal;font-size:13px;color:var(--muted)}
.lessons{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.lesson:hover{border-color:var(--red)}
.lesson .no{width:58px;height:58px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.lesson .no small{font-size:11px;color:var(--muted)}
.lesson .no b{font-size:22px;font-weight:900}
.lesson .body{flex:1;min-width:0}
.lesson .ttl{font-family:var(--jpd);font-size:18px;line-height:1.5}
.lesson .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.lesson .meta b{color:var(--ink2);font-weight:700}
.inapp{background:#F2C14E;color:#1E1C19;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.inapp b{display:block;margin-bottom:4px}
.inapp p{margin:0 0 10px;font-size:14px}
.inapp a{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:12px;background:#1E1C19;color:#fff;font-weight:700;text-decoration:none}

/* lesson */
.lsw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.lsw::-webkit-scrollbar{display:none}
.lsw button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-size:14px;min-height:40px}
.lsw button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.l-head{margin:16px 0 4px}
.l-head small{color:var(--red);font-weight:700;letter-spacing:.08em;font-size:13px}
.l-head h2{margin:2px 0 0;font-family:var(--jpd);font-size:clamp(24px,6vw,30px);line-height:1.4}
.next{margin-top:14px;padding:16px;border-radius:18px;background:var(--navy);color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] .next{background:#22364F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:#22364F}}
.next .t{flex:1 1 220px}
.next small{display:block;font-size:12px;opacity:.75;letter-spacing:.06em}
.next b{display:block;font-size:17px}
.next span{font-size:13px;opacity:.85}
.next .btn{background:#fff;color:#1E1C19;border-color:#fff;flex:0 0 auto}
.stepcard{padding:16px}
.stepcard .stat{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.stepcard .stat .bar{flex:1}
.qn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* cards */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
.fcard{position:relative;min-height:330px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 0 var(--soft);padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.fcard .tag{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);background:var(--soft2);border-radius:8px;padding:2px 8px}
.fcard .kn{position:absolute;left:14px;top:40px;font-size:12px;color:var(--green);font-weight:700}
.fcard .say{position:absolute;right:12px;top:10px}
.say{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--red);flex:none}
.say:hover{background:var(--red-t)}
.say.sm{width:38px;height:38px}
.say.sm svg{width:17px;height:17px}
.word{font-family:var(--jpd);font-weight:600;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.fcard .word{font-size:clamp(38px,11vw,60px);margin-top:10px}
.fcard .word.long{font-size:clamp(26px,7.5vw,40px)}
.fcard .word.zh{font-family:var(--zh);font-weight:700}
.fcard .back{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);width:100%}
.fcard .back .m{font-size:22px;font-weight:700}
.fcard .back .w{font-family:var(--jpd);font-weight:600;font-size:34px;line-height:1.5}
.fcard .back .r{font-family:var(--jp);color:var(--muted);font-size:17px}
.fcard .hint{margin-top:16px;font-size:13px;color:var(--faint)}
.cnav{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin-top:16px}
.cnav .icon{min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.cnav .icon:hover{border-color:var(--ink2)}
.known-on{background:var(--green-t)!important;border-color:var(--green)!important;color:var(--green)!important}
details.opts{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.opts summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--ink2);list-style:none}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.opts[open] summary::after{content:"－"}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.done{padding:24px 20px;text-align:center}
.done h3{margin:6px 0 4px;font-size:22px}
.done .big{font-family:var(--jpd);font-size:44px;color:var(--red);line-height:1}

/* list */
.search{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:10px 14px;font-size:16px}
.search:focus{outline:none;border-color:var(--navy)}
.wlist{margin-top:10px;display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,1fr) 10px;gap:10px;align-items:center;text-align:left;width:100%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.wrow:hover{border-color:var(--red)}
.wrow .ic{width:34px;height:34px;border-radius:50%;background:var(--red-t);color:var(--red);display:flex;align-items:center;justify-content:center}
.wrow .ic svg{width:16px;height:16px}
.wrow .w{font-family:var(--jpd);font-weight:600;font-size:20px;line-height:1.55}
.wrow .r{display:block;font-family:var(--jp);font-size:12px;color:var(--muted)}
.wrow .m{font-size:14px;color:var(--ink2)}
.wrow .d{width:8px;height:8px;border-radius:50%}

/* quiz */
.qtags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.qtag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--red-t);color:var(--red)}
.qtag.g{background:var(--soft);color:var(--muted);font-weight:500}
.qtags .chip{margin-left:auto;min-height:32px;padding:3px 12px;font-size:13px}
.passage{padding:14px 16px;margin-bottom:12px}
.passage .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--muted)}
.passage .tx{font-family:var(--jp);font-size:17px;line-height:2.15}
.prompt{display:flex;gap:12px;align-items:flex-start;padding:16px;margin-bottom:12px}
.prompt .tx{flex:1;font-size:19px;line-height:2.05;font-weight:500}
.prompt .tx.ja{font-family:var(--jp);font-size:20px}
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 8px}
.listen .bigsay{width:96px;height:96px;border-radius:50%;border:none;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--red-d)}
.listen .bigsay:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.listen .bigsay svg{width:40px;height:40px}
.listen .rev{font-family:var(--jpd);font-weight:600;font-size:30px;line-height:1.6}
.bigq{text-align:center;padding:20px 12px;font-size:clamp(30px,9vw,46px);line-height:1.5;margin-bottom:12px}
.bigq.zh{font-weight:700;font-size:clamp(24px,7vw,34px)}
.opts4{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.opt .v{flex:1;font-size:17px;line-height:1.9}
.opt .v.ja{font-family:var(--jp);font-size:19px}
.opt .mk{font-size:13px;font-weight:700}
.opt.ok{border-color:var(--green);background:var(--green-t)}
.opt.ok .l{background:var(--green);color:#fff}
.opt.ok .mk{color:var(--green)}
.opt.ng{border-color:var(--red);background:var(--red-t)}
.opt.ng .l{background:var(--red);color:#fff}
.opt.ng .mk{color:var(--red)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.short{display:flex;gap:10px;flex-wrap:wrap}
.short input{flex:1 1 220px;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-family:var(--jp);font-size:19px}
.short input:focus{outline:none;border-color:var(--navy)}
.short input.ok{border-color:var(--green)}.short input.ng{border-color:var(--red)}
.feed{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--green-t);border-left:5px solid var(--green)}
.feed.ng{background:var(--red-t);border-left-color:var(--red)}
.feed h4{margin:0 0 4px;font-size:18px;color:var(--green)}
.feed.ng h4{color:var(--red)}
.feed .ans{font-family:var(--jp);font-size:19px;font-weight:700;line-height:2}
.feed .exp{margin-top:4px;color:var(--ink2);font-size:15px;line-height:1.9}
.feed .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.feed .acts .btn{min-height:40px;padding:6px 14px;font-size:14px}
.qnext{margin-top:14px}

/* result */
.res{padding:24px 20px;text-align:center}
.res .score{font-size:64px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.res .msg{font-family:var(--jpd);font-size:18px;margin-top:6px}
.wlog{display:grid;gap:8px;margin-top:10px}
.wlog .it{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.wlog .q{line-height:1.9}
.wlog .a{margin-top:2px}
.wlog .a b{color:var(--green);font-family:var(--jp)}
.wlog .y{color:var(--red);font-family:var(--jp)}
.wlog .tg{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft2);border-radius:6px;padding:0 6px;margin-bottom:2px}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mc{min-height:62px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:6px 8px;font-size:15px;line-height:1.6;transition:opacity .2s}
.mc.ja{font-family:var(--jpd);font-weight:600;font-size:19px}
.mc.sel{border-color:var(--navy);background:var(--navy-t)}
.mc.ok{border-color:var(--green);background:var(--green-t);opacity:.45}

.modal{position:fixed;inset:0;z-index:50;background:rgba(20,18,14,.45);display:flex;align-items:flex-end;justify-content:center}

.sheet .note{font-size:13px;color:var(--muted);margin-top:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

// ===== 統一假名標註引擎：只在漢字上標註 =====
const KANJI=/[\u4e00-\u9fff々〆]/;
function makeFuri(FURI_SRC, vocab, EXTRA){
  const dict=[];
  (FURI_SRC+' '+(EXTRA||'')).trim().split(/\s+/).forEach(e=>{const m=e.match(/^([^\[:]+)(?:\[([^\]]+)\])?:(.+)$/);if(m)dict.push({k:m[1],c:m[2]?new RegExp('^['+m[2]+']'):null,r:m[3],src:'base'});});
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  // 依讀音對齊：把漢字串與假名讀音配對
  function align(k,r){
    // 三種字元：漢字（要標註）、數字（對應讀音但不標註）、其他（假名、符號，必須逐字吻合）
    const kind=ch=>KANJI.test(ch)?'k':/[0-9０-９]/.test(ch)?'n':'o';
    const toks=[];for(const ch of k){const t=kind(ch);if(toks.length&&toks[toks.length-1].kd===t)toks[toks.length-1].t+=ch;else toks.push({t:ch,kd:t});}
    if(!toks.some(t=>t.kd==='k'))return [{t:k,r:''}];
    const m=r.match(new RegExp('^'+toks.map(t=>t.kd==='o'?esc(t.t):'(.+?)').join('')+'$'));
    if(!m)return null;let g=1;return toks.map(t=>{if(t.kd==='o')return {t:t.t,r:''};const rr=m[g++];return {t:t.t,r:t.kd==='k'?rr:''};});
  }
  // 從單字表自動補充字典（讀音對齊得到的漢字串）
  const have=new Set(dict.map(d=>d.k+'|'+(d.c?d.c.source:'')));
  for(const w of vocab){const a=align(w.k,w.r);if(!a)continue;
    a.forEach((g,i)=>{if(!g.r)return;const next=(a[i+1]&&a[i+1].t[0])||'';
      const single=g.t.length===1;const c=single&&next&&!KANJI.test(next)?new RegExp('^['+esc(next)+']'):null;
      const key=g.t+'|'+(c?c.source:'');if(have.has(key))return;
      if(single&&!c&&dict.some(d=>d.k===g.t&&!d.c))return;
      have.add(key);dict.push({k:g.t,c,r:g.r,src:'vocab'});});}
  dict.sort((a,b)=>(b.k.length-a.k.length)||((b.c?1:0)-(a.c?1:0))||((a.src==='base'?0:1)-(b.src==='base'?0:1)));
  function push(out,t,r){if(!r&&out.length&&!out[out.length-1].r)out[out.length-1].t+=t;else out.push({t,r:r||''});}
  function byDict(text){const out=[];let i=0;
    while(i<text.length){const ch=text[i];
      if(KANJI.test(ch)){const e=dict.find(e=>text.startsWith(e.k,i)&&(!e.c||e.c.test(text[i+e.k.length]||'')));
        if(e){push(out,e.k,e.r);i+=e.k.length;continue;}}

    return out;}
  // 唯一入口：有讀音就對齊，沒有就查字典；結果只會在漢字上有 r
  function annotate(text,reading){if(!text)return [];
    if(reading){const a=align(text,reading);if(a){const out=[];a.forEach(g=>push(out,g.t,g.r));return out;}}
    return byDict(text);}
  function uncovered(text){return byDict(text).filter(g=>!g.r&&KANJI.test(g.t)).map(g=>g.t.split('').filter(c=>KANJI.test(c)).join(''));}
  return {annotate,align,byDict,uncovered,dict};
}
if(typeof module!=='undefined')module.exports={makeFuri,KANJI};

/* ---------------- helpers ---------------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasKana=t=>/[\u3040-\u30ff]/.test(t||'');
const hasKanji=t=>KANJI.test(t||'');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const say=r=>r.replace(/［[^］]*］/g,'').replace(/[（）()\s]/g,'');
const cleanSpeak=t=>t.replace(/（[\s　]*）/g,'、').replace(/\b[A-D]：/g,'').replace(/：/g,'、').replace(/→/g,'、').replace(/\s+/g,'');
const fmtDialog=t=>t.replace(/([。？！])\s*(?=[^\s。？！：、（）「」]{1,5}：)/g,'$1\n').replace(/\s+(?=[^\s。？！：、（）「」]{1,5}：)/g,'\n').trim();
const norm=s=>(s||'').replace(/[\s　。．.、,，！!？?]/g,'').normalize('NFKC');

/* ---------------- 假名標註：全站唯一的輸出方式 ----------------
   ja(text, reading, hide) 任何日文都經過這裡：
   有讀音（單字表）→ 依讀音對齊；沒有 → 查同一份字典。只有漢字會加上 <rt>。 */
function rubyHTML(segs,hide){
  const on=S.settings.furi!==false&&!hide;
  return segs.map(g=>g.r&&on?`<ruby>${esc(g.t)}<rt>${esc(g.r)}</rt></ruby>`:esc(g.t)).join('').replace(/\n/g,'<br>');
}
function ja(text,reading,hide){return rubyHTML(F.annotate(text,reading),hide);}
function readingOf(t){const w=ALL_VOCAB.find(x=>x.k===t);return w?w.r:null;}
function jaWord(t,hide){return ja(t,readingOf(t),hide);}
const isJaWord=t=>hasKana(t)||VK.has(t);
// 中文句子裡的「日文」：只有引號內被判定為日文的部分才標註
function mixed(text,mask){
  return String(text||'').split(/(「[^」]*」)/).map(p=>{
    if(/^「.*」$/.test(p)){const inner=p.slice(1,-1);return '「'+(isJaWord(inner)?jaWord(inner,mask):esc(inner))+'」';}
    return esc(p);
  }).join('').replace(/\n/g,'<br>');
}

/* ---------------- state ---------------- */
const S={screen:'home',lesson:LESSONS[0],settings:{rate:0.85,engine:'auto',voice:'',auto:true,face:'jp',qn:10,furi:true},prog:{},wrong:[],last:null,
  cards:null,quiz:null,match:null,listQ:'',voices:[],result:null,modal:false};
try{const s=JSON.parse(localStorage.getItem(STORE)||'{}');Object.assign(S.settings,s.settings||{});S.prog=s.prog||{};S.wrong=s.wrong||[];S.last=s.last||null;}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify({settings:S.settings,prog:S.prog,wrong:S.wrong,last:S.last}));}catch(e){}}
const P=L=>{const p=S.prog[L]||{};return {known:p.known||[],best:p.best||{}};};
function setP(L,fn){S.prog[L]=fn(P(L));save();}
function setLast(L,key,label){S.last={L,key,label};save();}

/* ---------------- speech ---------------- */
let audioEl=null;
function loadVoices(){try{S.voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test((v.lang||'').replace('_','-')));}catch(e){}if(S.modal)renderModal();}
function pickVoice(){const vs=S.voices;if(!vs.length)return null;if(S.settings.voice){const v=vs.find(v=>v.name===S.settings.voice);if(v)return v;}
  const rank=[/Nanami|Keita|Aoi|Daichi|Mayu|Naoki|Shiori|Natural/i,/Google/i,/Kyoko|O-ren|Otoya|Hattori|Enhanced|Premium|拡張|プレミアム/i,/Haruka|Ayumi|Ichiro|Sayaka/i];
  for(const r of rank){const v=vs.find(v=>r.test(v.name));if(v)return v;}return vs[0];}
function speak(t){if(!t)return;const st=S.settings,v=pickVoice();
  if(audioEl){try{audioEl.pause();}catch(e){}}
  const dev=window.speechSynthesis&&(st.engine==='device'||(st.engine==='auto'&&v));
  if(dev){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';if(v)u.voice=v;u.rate=st.rate;speechSynthesis.speak(u);return;}catch(e){}}
  online(t);}
function online(t){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
  const a=new Audio();a.src='https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&ttsspeed='+(S.settings.rate<0.8?'0.5':S.settings.rate<0.95?'0.8':'1')+'&q='+encodeURIComponent(t.slice(0,190));
  audioEl=a;const p=a.play();if(p&&p.catch)p.catch(()=>toast('無法播放語音，請確認已連網，或改用 Chrome／Safari 開啟'));}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2800);}

/* ---------------- navigation ---------------- */
function go(screen,extra){Object.assign(S,{screen},extra||{});render();try{window.scrollTo(0,0);}catch(e){}}
function back(){
  if(S.screen==='lesson'||S.screen==='wrong')return go('home');
  const fromWrong=(S.screen==='quiz'&&S.quiz&&S.quiz.meta.from==='wrong')||(S.screen==='result'&&S.result&&S.result.meta.from==='wrong');
  if(S.screen==='quiz'&&S.quiz&&S.quiz.results.length&&S.quiz.results.length<S.quiz.items.length&&!window.confirm('確定要離開測驗嗎？目前進度不會保存。'))return;
  if(fromWrong)return go('wrong');
  go('lesson');}

/* ---------------- 建議下一步 ---------------- */
function nextStep(L){
  const p=P(L),n=D.vocab[L].length,kn=p.known.length;
  if(kn/n<0.5)return {label:'有聲單字卡',why:`已記住 ${kn}/${n} 個單字，先把單字聽熟`,act:()=>startCards(L)};
  for(const m of Object.keys(MODES)){if((p.best[m]||0)<80)return {label:MODES[m].name,why:p.best[m]!=null?`目前最佳 ${p.best[m]}%，目標 80% 以上`:'單字練習還沒做過',act:()=>startVocab(L,m)};}
  if((p.best['bank-mock']||0)<80)return {label:'隨機模擬測驗',why:p.best['bank-mock']!=null?`目前最佳 ${p.best['bank-mock']}%，目標 80% 以上`:'單字練習都過關了，挑戰課堂題庫',act:()=>startBank(L,'mock')};
  const i=LESSONS.indexOf(L);
  if(i<LESSONS.length-1)return {label:`前往第${LESSONS[i+1]}課`,why:'這一課已經完成，繼續下一課',act:()=>go('lesson',{lesson:LESSONS[i+1]})};
  if(S.wrong.length)return {label:'複習錯題本',why:`還有 ${S.wrong.length} 題錯題`,act:()=>go('wrong')};
  return {label:'隨機模擬測驗',why:'全部完成！再挑戰一次保持手感',act:()=>startBank(L,'mock')};
}

/* ---------------- cards ---------------- */
function curWord(){const c=S.cards;if(!c||!c.order.length)return null;return D.vocab[S.lesson][c.order[c.i]];}
function speakCur(){const w=curWord();if(w)speak(say(w.r));}
function buildOrder(L,onlyNew,shuffle){const known=P(L).known;let o=D.vocab[L].map((_,i)=>i);if(onlyNew)o=o.filter(i=>!known.includes(i));return shuffle?sh(o):o;}
function startCards(L,onlyNew){L=L||S.lesson;setLast(L,'cards','有聲單字卡');
  go('cards',{lesson:L,cards:{order:buildOrder(L,!!onlyNew,false),i:0,flip:false,onlyNew:!!onlyNew,shuffled:false,done:false}});
  if(S.settings.auto&&S.settings.face==='jp')speakCur();}
function cardGo(d){const c=S.cards,n=c.order.length;if(!n)return;
  if(d>0&&c.i===n-1){c.done=true;render();return;}
  c.i=(c.i+d+n)%n;c.flip=false;c.done=false;render();if(S.settings.auto&&S.settings.face==='jp')speakCur();}
function flip(){const c=S.cards;if(!c||!c.order.length||c.done)return;c.flip=!c.flip;render();if(c.flip&&S.settings.face==='zh')speakCur();}

/* ---------------- quiz items ---------------- */
function vocabItem(L,idx,mode){const ws=D.vocab[L],w=ws[idx];if(!w)return null;const field=mode==='listen'?'m':mode==='reading'?'r':'k';
  const seen=new Set([w[field]]),ds=[];for(const x of sh(ws)){if(x===w||x.m===w.m)continue;if(!seen.has(x[field])){seen.add(x[field]);ds.push(x[field]);}if(ds.length===3)break;}
  const opts=sh([w[field],...ds]);
  return {kind:'mc',key:`v|${L}|${idx}|${mode}`,vmode:mode,w,L,type:MODES[mode].name,opts,ans:opts.indexOf(w[field]),optJa:mode!=='listen',ansAudio:say(w.r),
    audio:mode==='listen'?say(w.r):null,auto:mode==='listen',speakOnAnswer:mode!=='listen'};}
function vocabItems(L,mode,n){const ws=D.vocab[L];let idx=ws.map((_,i)=>i);if(mode==='reading')idx=idx.filter(i=>hasKanji(ws[i].k)&&ws[i].k!==ws[i].r);return sh(idx).slice(0,n||idx.length).map(i=>vocabItem(L,i,mode));}
function bankItem(L,n){const q=D.quiz[L].find(x=>x.n===n);if(!q)return null;const quoted=(q.q.match(/「([^」]+)」/)||[])[1];
  const jaType=JA_TYPES.includes(q.type);let audio=null;
  if(jaType)audio=cleanSpeak(q.q);else if((q.type==='單字'||q.type==='動詞變化')&&quoted)audio=quoted;
  const ansText=q.short?q.ans:q.opts[q.ans];let ansAudio=null;
  if(q.short)ansAudio=q.ans;else if(hasKana(ansText)||VK.has(ansText)){ansAudio=(/（[\s　]*）/.test(q.q)&&jaType)?cleanSpeak(q.q.replace(/（[\s　]*）/,ansText)):ansText;}
  const optJa=q.opts.some(hasKana)||(q.opts.length>0&&q.opts.every(o=>VK.has(o)));
  return {kind:q.short?'short':'mc',key:`b|${L}|${n}`,L,n,type:q.type,q:q.q,jaType,opts:q.opts,ans:q.ans,alts:q.short?(ALT[q.ans]||[]):null,exp:q.exp,passage:q.passage,
    audio,ansAudio,ansFull:!!(ansAudio&&ansAudio!==ansText),optJa,mask:q.type==='假名'||/讀音/.test(q.q)};}
function bankItems(L,mode){const qs=D.quiz[L];let list=qs;if(mode==='mock')list=sh(qs).slice(0,20);else if(mode!=='all')list=qs.filter(q=>q.type===mode);return list.map(q=>bankItem(L,q.n));}
function itemFromKey(k){const p=k.split('|');if(p[0]==='b')return bankItem(p[1],+p[2]);return vocabItem(p[1],+p[2],p[3]);}
function startVocab(L,m){setLast(L,m,MODES[m].name);startQuiz(vocabItems(L,m,S.settings.qn),MODES[m].name,{L,key:m,mode:m,from:'lesson'});}
function startBank(L,mode){const title=mode==='all'?'課堂題庫・依序作答':mode==='mock'?'隨機模擬測驗':'題庫・'+mode;setLast(L,'bank-'+mode,title);startQuiz(bankItems(L,mode),title,{L,key:'bank-'+mode,mode,from:'lesson'});}
function startQuiz(items,title,meta){items=items.filter(Boolean);if(!items.length){toast('沒有可作答的題目');return;}
  if(meta.L)S.lesson=meta.L;
  go('quiz',{quiz:{items,i:0,title,meta,picked:null,typed:'',checked:false,correct:null,results:[]}});const q=items[0];if(q.auto&&q.audio)speak(q.audio);}
function record(correct,your){const qz=S.quiz,q=qz.items[qz.i];
  S.wrong=S.wrong.filter(k=>k!==q.key);if(!correct)S.wrong.unshift(q.key);save();
  qz.checked=true;qz.correct=correct;qz.results.push({q,correct,your});render();

  const ids=pairs.map(p=>p.id);setLast(L,'match','配對遊戲');go('match',{lesson:L,match:{pairs,left:sh(ids),right:sh(ids),sel:null,done:[],miss:0,flash:[],t0:Date.now(),t1:null}});}

  return h;}
function vMatch(){const m=S.match,P2=id=>m.pairs.find(p=>p.id===id);
  const card=(side,id,inner,cls)=>{const done=m.done.includes(id),sel=m.sel&&m.sel.side===side&&m.sel.id===id,fl=m.flash.includes(side+id);
    return `<button class="mc ${cls} ${fl?'ng':sel?'sel':done?'ok':''}" data-a="tapM" data-v="${side}|${id}" ${done?'disabled':''}>${inner}</button>`;};
  let h=`<div class="prog"><span>將日文與中文意思配對（點日文會發音）</span><span style="margin-left:auto">失誤 ${m.miss}</span></div>
    <div class="mgrid"><div class="mcol">${m.left.map(id=>card('L',id,ja(P2(id).w.k,P2(id).w.r),'ja')).join('')}</div><div class="mcol">${m.right.map(id=>card('R',id,esc(P2(id).w.m),'')).join('')}</div></div>`;
  if(m.t1)h+=`<div class="card done" style="margin-top:14px"><div class="big">✓</div><h3>全部配對完成！</h3><p class="muted">用時 ${Math.round((m.t1-m.t0)/1000)} 秒・失誤 ${m.miss} 次</p><div class="row" style="margin-top:12px"><button class="btn btn-red" data-a="match">下一輪</button><button class="btn" data-a="back">回到本課</button></div></div>`;
  return h;}
function vWrong(){const items=S.wrong.map(itemFromKey).filter(Boolean);
  if(!items.length)return `<div class="card empty"><div style="font-size:40px">✓</div>目前沒有錯題，繼續保持！</div>`;
  return `<p class="muted" style="margin-top:0">共 ${items.length} 題。重新作答答對後，該題會自動從錯題本移除。</p>
    <div class="row"><button class="btn btn-red" data-a="startWrong">開始複習錯題</button><button class="btn" data-a="clearWrong">清空錯題本</button></div>
    <div class="wlog sec">${items.map(q=>`<div class="it"><span class="tg">第${q.L}課・${esc(q.type)}</span><div class="q">${summaryHTML(q)}</div><div class="a">正確答案：<b>${ansOf(q)}</b></div></div>`).join('')}</div>`;}

/* ---------------- settings modal ---------------- */
function voiceInfo(){const st=S.settings,v=pickVoice();if(st.engine==='online')return '目前使用：線上語音（Google 日語，需連網）';if(v&&window.speechSynthesis)return '目前使用裝置語音：'+v.name;return st.engine==='device'?'此裝置找不到日語語音，請改選「自動」或「線上語音」':'此裝置未安裝日語語音，將自動改用線上語音（需連網）';}
function renderModal(){const el=document.getElementById('modal');if(!S.modal){el.innerHTML='';return;}const st=S.settings;
  const seg=(a,list,cur)=>`<span class="seg">${list.map(([v,l])=>`<button data-a="${a}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</span>`;
  el.innerHTML=`<div class="modal" data-a="closeModal"><div class="sheet" role="dialog" aria-label="語音與顯示設定" data-stop="1">
    <div class="sh-h"><h3>語音與顯示設定</h3><button class="btn btn-red" style="min-height:40px" data-a="closeModal">完成</button></div>
    <div class="note" style="margin-bottom:8px">${esc(voiceInfo())}</div>
    <div class="grp"><b>語速</b>${seg('rate',[[0.7,'慢速'],[0.85,'標準'],[1,'自然']],st.rate)}</div>
    <div class="grp"><b>語音來源</b>${seg('engine',[['auto','自動'],['device','裝置語音'],['online','線上語音']],st.engine)}<div class="note">若裝置語音聽起來不自然或沒有聲音，請改選「線上語音」（需連網）。</div></div>
    ${S.voices.length?`<div class="grp"><b>裝置日語語音</b><select id="voiceSel"><option value="">自動選擇最佳語音</option>${S.voices.map(v=>`<option value="${esc(v.name)}" ${v.name===st.voice?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>`:''}
    <div class="grp"><b>單字卡自動發音</b>${seg('cauto',[['1','開啟'],['0','關閉']],st.auto?'1':'0')}</div>
    <div class="grp"><b>漢字上方標註假名</b>${seg('furi',[['1','顯示'],['0','隱藏']],st.furi!==false?'1':'0')}<div class="note">所有單元使用同一套標註方式：只在漢字上方標註讀音，假名不重複標註。</div></div>
    <button class="btn btn-block" data-a="testVoice">${I.sound}試聽：こんにちは。にほんごをべんきょうしましょう。</button>
  </div></div>`;}

/* ---------------- render ---------------- */
function render(){renderHeader();const m=document.getElementById('main');
  const v={home:vHome,lesson:vLesson,cards:vCards,list:vList,quiz:vQuiz,result:vResult,match:vMatch,wrong:vWrong}[S.screen];
  m.innerHTML=v?v():'';if(S.screen==='list')listRows();renderModal();}

/* ---------------- events ---------------- */
const ACT={
  back,settings:()=>{S.modal=true;renderModal();},closeModal:()=>{S.modal=false;renderModal();render();},
  lesson:v=>go('lesson',{lesson:v}),wrong:()=>go('wrong'),
  resume:()=>{const l=S.last;if(!l)return;S.lesson=l.L;if(l.key==='cards')return startCards(l.L);if(l.key==='match')return startMatch(l.L);if(MODES[l.key])return startVocab(l.L,l.key);if(/^bank-/.test(l.key))return startBank(l.L,l.key.slice(5));go('lesson');},
  next:()=>{if(NEXT)NEXT.act();},
  cards:()=>startCards(S.lesson),cardsAll:()=>startCards(S.lesson,false),cardsNew:()=>startCards(S.lesson,true),cardsRestart:()=>{const c=S.cards;c.i=0;c.done=false;c.flip=false;render();if(S.settings.auto&&S.settings.face==='jp')speakCur();},
  list:()=>go('list',{listQ:''}),vocab:v=>startVocab(S.lesson,v),match:()=>startMatch(S.lesson),bank:v=>startBank(S.lesson,v),
  qn:v=>{S.settings.qn=+v;save();render();},
  flip,cardPrev:()=>cardGo(-1),cardNext:()=>cardGo(1),speakCur,
  known:()=>{const c=S.cards,L=S.lesson,idx=c.order[c.i],isK=P(L).known.includes(idx);setP(L,p=>({...p,known:isK?p.known.filter(x=>x!==idx):[...p.known,idx]}));if(!isK)setTimeout(()=>cardGo(1),160);else render();},
  cface:v=>{S.settings.face=v;save();S.cards.flip=false;render();},
  conly:v=>{const c=S.cards;c.onlyNew=v==='1';c.order=buildOrder(S.lesson,c.onlyNew,c.shuffled);c.i=0;c.flip=false;c.done=false;render();},
  cshuf:v=>{const c=S.cards;c.shuffled=v==='1';c.order=buildOrder(S.lesson,c.onlyNew,c.shuffled);c.i=0;c.flip=false;c.done=false;render();},
  cauto:v=>{S.settings.auto=v==='1';save();render();},
  furi:v=>{S.settings.furi=v==='1';save();render();},furiToggle:()=>{S.settings.furi=S.settings.furi===false;save();render();},
  rate:v=>{S.settings.rate=+v;save();renderModal();},engine:v=>{S.settings.engine=v;save();renderModal();},testVoice:()=>speak('こんにちは。にほんごをべんきょうしましょう。'),
  say:v=>speak(v),sayw:v=>speak(v),
  playQ:()=>{const q=S.quiz.items[S.quiz.i];speak(q.audio);},playAns:()=>{const q=S.quiz.items[S.quiz.i];speak(q.ansAudio);},
  pick:v=>pick(+v),submitShort,acceptShort,nextQ,
  retryWrong:()=>{const r=S.result;startQuiz(r.wrong.map(x=>x.q.key[0]==='v'?itemFromKey(x.q.key):x.q),'重做錯題',{...r.meta,key:null});},
  again:()=>{const r=S.result,m=r.meta;if(m.from==='wrong')return startQuiz(sh(S.wrong.map(itemFromKey)),'錯題複習',m);if(MODES[m.mode])return startVocab(m.L,m.mode);startBank(m.L,m.mode);},
  tapM:v=>{const [s,id]=v.split('|');tapM(s,+id);},
  startWrong:()=>startQuiz(sh(S.wrong.map(itemFromKey)),'錯題複習',{from:'wrong'}),
  clearWrong:()=>{if(window.confirm('確定要清空錯題本？')){S.wrong=[];save();render();}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='closeModal'&&el.classList.contains('modal')&&e.target.closest('[data-stop]'))return;
  if(a==='flip'&&e.target.closest('button'))return;
  if(ACT[a]){e.preventDefault();ACT[a](el.dataset.v);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='listQ'){S.listQ=e.target.value;listRows();}
  else if(e.target.id==='shortIn'&&S.quiz){S.quiz.typed=e.target.value;}
});
document.addEventListener('change',e=>{if(e.target.id==='voiceSel'){S.settings.voice=e.target.value;save();renderModal();speak('こんにちは');}});
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(e.target.id==='shortIn'&&e.key==='Enter'&&!e.isComposing&&!S.quiz.checked){e.preventDefault();submitShort();return;}
  if(e.key==='Escape'&&S.modal){S.modal=false;renderModal();return;}
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(S.screen==='cards'&&S.cards){if(e.key===' '||e.key==='Enter'){if(tag==='BUTTON'&&e.target.id!=='fcard')return;e.preventDefault();flip();}else if(e.key==='ArrowRight')cardGo(1);else if(e.key==='ArrowLeft')cardGo(-1);else if(e.key==='p')speakCur();}
  else if(S.screen==='quiz'&&S.quiz){const q=S.quiz.items[S.quiz.i];if(!S.quiz.checked&&q.kind==='mc'&&/^[1-4]$/.test(e.key))pick(+e.key-1);else if(S.quiz.checked&&e.key==='Enter'&&tag!=='BUTTON'){e.preventDefault();nextQ();}}
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{if(!e.target.closest('#fcard'))return;const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(!e.target.closest('#fcard'))return;const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();cardGo(dx<0?1:-1);}});

if(window.speechSynthesis){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){speechSynthesis.onvoiceschanged=loadVoices;}setTimeout(loadVoices,800);setTimeout(loadVoices,2500);}
render();
})();

</script>
</body>
